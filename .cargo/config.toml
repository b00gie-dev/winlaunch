# Link the C runtime statically: winlaunch.exe then imports no VCRUNTIME140.dll, which
# Windows would look for next to the EXE first (a folder any program may write to,
# while the autostart instance runs elevated). It also needs no VC++ redistributable.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
