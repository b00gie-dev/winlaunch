[package]
name = "winlaunch"
version = "0.8.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/b00gie-dev/winlaunch"

[dependencies]
fluent-bundle = "0.16.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde"] }
unic-langid = "0.9.6"
velopack = "1.2.161"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Networking_WinHttp",
    "Win32_System_DataExchange",
    "Win32_System_Environment",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# COM-based shell APIs (app list, icons, unelevated launch). Plain Win32 stays on windows-sys.
[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_System_Ole",
    "Win32_System_Search",
    "Win32_System_TaskScheduler",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
fluent-syntax = "0.12"
